services:
  - type: web
    name: bioorbit-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    startCommand: npm start
    buildCommand: npm install
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORPORATE_TOKEN
        sync: false
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_APP_PASSWORD
        sync: false
      - key: FRONTEND_URL
        value: https://bio-orbit.vercel.app
    healthCheckPath: /health
