services:
  - type: web
    name: bioorbit-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    startCommand: npm start
    buildCommand: npm install
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORPORATE_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        # A Resend restringe este remetente ao e-mail do titular da conta.
        value: bioorbit@resend.dev
      - key: FRONTEND_URL
        value: https://bio-orbit.vercel.app
    healthCheckPath: /health
